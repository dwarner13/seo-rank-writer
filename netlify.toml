[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Increase timeout for AI-heavy functions (requires Netlify Pro for >10s)
  external_node_modules = ["stripe"]

[functions."generate"]
  timeout = 60

[functions."humanize"]
  timeout = 60

[functions."keyword-research"]
  timeout = 30

[functions."regenerate-field"]
  timeout = 30

[functions."internal-links"]
  timeout = 30
